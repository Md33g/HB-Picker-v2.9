<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Ambient Red Glow -->
  <circle cx="256" cy="256" r="140" fill="#dc2626" opacity="0.25" filter="url(#glow)" />
  
  <!-- Outer Diamond Target Frame -->
  <g transform="translate(256, 256) rotate(45)">
    <!-- Diamond Outer Border -->
    <rect x="-110" y="-110" width="220" height="220" rx="36" fill="url(#gemGrad)" stroke="#ffffff" stroke-width="6" stroke-opacity="0.9" />
    
    <!-- Inner Diamond Facet -->
    <rect x="-75" y="-75" width="150" height="150" rx="24" fill="#09090b" opacity="0.85" />
    
    <!-- Center Core Swatch -->
    <rect x="-45" y="-45" width="90" height="90" rx="16" fill="#ff3b30" stroke="#ffffff" stroke-width="4" />
  </g>
  
  <!-- Crosshair Reticle Ring Overlay -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="16 12" opacity="0.6"/>
  <line x1="256" y1="60" x2="256" y2="100" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="412" x2="256" y2="452" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="60" y1="256" x2="100" y2="256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="412" y1="256" x2="452" y2="256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
